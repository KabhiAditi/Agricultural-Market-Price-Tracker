server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ampt
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

ampt:
  alert:
    threshold-percent: 15
    cutoff-hour: 17

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/amptdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/amptdb}
    username: ${DB_USER:ampt}
    password: ${DB_PASSWORD:ampt}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
