<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Agricultural Market Price Tracker</title>
    <style>
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --info-bg: #eff6ff;
            --info-text: #1d4ed8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: var(--text-main);
        }
        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }
        .alert {
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
        }
        .alert-danger {
            background-color: var(--danger-bg);
            color: var(--danger);
            border-color: #fecaca;
        }
        .alert-success {
            background-color: var(--success-bg);
            color: var(--success);
            border-color: #bbf7d0;
        }
        .alert-info {
            background-color: var(--info-bg);
            color: var(--info-text);
            border-color: #bfdbfe;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 0.75rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
        }
        button.btn-submit {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.btn-submit:hover {
            background-color: var(--primary-hover);
        }
        .demo-accounts {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border);
            font-size: 0.825rem;
            color: var(--text-muted);
        }
        .demo-accounts table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        .demo-accounts th, .demo-accounts td {
            padding: 0.35rem 0.5rem;
            text-align: left;
        }
        .demo-accounts code {
            background: #f1f5f9;
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            color: #0f172a;
            font-size: 0.8rem;
        }
        .nav-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.875rem;
            color: var(--primary);
            text-decoration: none;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <div class="logo">🌾</div>
            <h1>Sign In to AMPT</h1>
            <p class="subtitle">Agricultural Market Price Tracker</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:value="${redirect}"/>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="e.g. entry or viewer"/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password"/>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <a class="nav-link" th:href="@{/prices}">← Back to Public Search</a>

        <div class="demo-accounts">
            <strong>Seeded Test Accounts:</strong>
            <table>
                <tr>
                    <td><strong>Role</strong></td>
                    <td><strong>Username</strong></td>
                    <td><strong>Password</strong></td>
                </tr>
                <tr>
                    <td>Data Entry</td>
                    <td><code>entry</code></td>
                    <td><code>entry123</code></td>
                </tr>
                <tr>
                    <td>Viewer (Read-only)</td>
                    <td><code>viewer</code></td>
                    <td><code>viewer123</code></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
