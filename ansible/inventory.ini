# ==============================================================================
# Ansible Inventory for AMPT Infrastructure
# ==============================================================================

[app_servers]
# 1. WSL2 Direct Target (Native Linux with Systemd)
wsl-node ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# 2. Docker SSH Target (Ubuntu container running OpenSSH server on port 2222)
target-node-host ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ampt ansible_ssh_pass=ampt123 ansible_sudo_pass=ampt123

# 3. Docker-to-Docker Container Target (when running control node in container)
target-node ansible_host=target-node ansible_port=22 ansible_user=ampt ansible_ssh_pass=ampt123 ansible_sudo_pass=ampt123

[app_servers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
