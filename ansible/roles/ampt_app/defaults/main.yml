---
# ==============================================================================
# Defaults for ampt_app role
# ==============================================================================

ampt_service_name: ampt
ampt_systemd_enabled: true
ampt_service_restart_on_change: true

# Database defaults (H2 by default, or MySQL if app_env is mysql)
ampt_db_type: h2
ampt_h2_path: "{{ ampt_data_dir }}/amptdb"

# Release & Version Management
app_version: "v1.0.0"
ampt_releases_dir: "{{ ampt_home_dir }}/releases"
ampt_current_dir: "{{ ampt_home_dir }}/current"

# System directories to manage
ampt_directories:
  - path: "{{ ampt_home_dir }}"
    mode: "0750"
  - path: "{{ ampt_home_dir }}/bin"
    mode: "0750"
  - path: "{{ ampt_releases_dir }}"
    mode: "0750"
  - path: "{{ ampt_data_dir }}"
    mode: "0750"
  - path: "{{ ampt_log_dir }}"
    mode: "0755"
  - path: "{{ ampt_config_dir }}"
    mode: "0750"
